name: pre-commit

on:
    pull_request:
    push:
        branches: [main]

jobs:
    pre-commit:
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v5
        -   name: Install uv
            uses: astral-sh/setup-uv@v7
            with:
                version: "0.10.12"
                enable-cache: true
        # `ty check ontocast test` is a whole-program check, so every extra
        # whose code it walks has to be importable here: `server` (FastAPI app
        # + CLI), `documents` (docling-core types), `qdrant` and `graph`.
        # Syncing `dev` alone -- correct before the dependency tiering moved
        # those packages out of the base install -- made ty fail on ~40
        # unresolved imports.
        #
        # This deliberately stops short of `--all-extras` (8.8 GB vs 633 MB;
        # torch, docling/easyocr, lancedb, pygraphviz) because the heavy tier
        # is instead whitelisted in `[tool.ty.analysis] allowed-unresolved-imports`
        # in pyproject.toml. A new unresolved-import failure here means an
        # extra crossed that line: either add it below, or whitelist it there.
        -   name: Install dependencies (extras that ty type-checks)
            run: uv sync --extra dev --extra server --extra documents --extra qdrant --extra graph --no-install-project
        -   name: Run pre-commit
            run: uv run pre-commit run --all-files
