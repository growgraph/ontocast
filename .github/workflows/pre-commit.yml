name: pre-commit

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    pre-commit:
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v5
        -   name: Install uv
            uses: astral-sh/setup-uv@v7
            with:
                version: "0.10.12"
                enable-cache: true
        # `setup-uv`'s own cache covers uv's package cache, not the hook
        # environments, which live in ~/.cache/pre-commit. Without this step
        # every run rebuilt them from scratch and re-resolved each hook's
        # dependencies, so an unchanged repository could go red on a transitive
        # release. Keying on the config hash means a hook or pin change rebuilds
        # and everything else reuses.
        -   name: Cache hook environments
            uses: actions/cache@v5
            with:
                path: ~/.cache/pre-commit
                key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
        # This job is lint and formatting only, so it needs nothing but the
        # `dev` extra. Type checking runs in `tests.yml`, whose `unit` job
        # already installs every extra -- a whole-program check gets better
        # answers where the whole program is actually importable.
        -   name: Install dependencies
            run: uv sync --extra dev --no-install-project
        -   name: Run pre-commit
            run: uv run pre-commit run --all-files
            env:
                SKIP: ty
