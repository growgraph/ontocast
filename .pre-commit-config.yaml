fail_fast: false

repos:
  # Python linting and formatting
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
    -   id: ruff-check
        args: [--fix]
    -   id: ruff-format

  # Type checking
-   repo: local
    hooks:
    -   id: ty
        name: ty check
        entry: bash -c 'ty check ontocast test'
        language: system
        pass_filenames: false
        always_run: true

  # YAML formatting
-   repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.16.0
    hooks:
    -   id: pretty-format-yaml
        args: [--autofix, --indent, '4', --preserve-quotes]

  # JSON formatting
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: pretty-format-json
        args: [--autofix, --indent, '4', --no-sort-keys]

  # TOML formatting and sorting.
  # uv.lock is excluded: it is generated by `uv lock` in uv's own format, so
  # reformatting it here made every dependency change fail CI and then be
  # rewritten by the next uv run.
  #
  # `toml-sort` is the only TOML formatter here, and that is the point.
  # `pretty-format-toml` from language-formatters-pre-commit-hooks used to run
  # alongside it, but that hook is a thin wrapper around toml-sort -- so the
  # suite was running one formatter twice, through two independently resolved
  # copies of it. They drifted apart: toml-sort 0.25.0 swapped its engine from
  # tomlkit to tomlrt, which writes inline tables as `{ k = v }` where tomlkit
  # writes `{k = v}`. With the wrapper on a fresh resolve and this hook pinned
  # by `rev`, each one reverted the other's spacing on the `authors` table,
  # every run, forever. A single formatter cannot disagree with itself.
  #
  # tomlkit is pinned because `rev` does not pin it: pre-commit resolves a
  # hook's dependencies when it builds the environment, so a months-old cached
  # environment and a fresh CI one can format differently from identical config
  # -- which is how this passed locally while failing in CI. Bump deliberately.
-   repo: https://github.com/pappasam/toml-sort
    rev: v0.24.3
    hooks:
    -   id: toml-sort
        args: [-ia]
        exclude: ^uv\.lock$
        additional_dependencies: [tomlkit==0.15.1]
