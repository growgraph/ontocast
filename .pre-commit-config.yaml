fail_fast: false

repos:
  # Python linting and formatting
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
    -   id: ruff-check
        args: [--fix]
    -   id: ruff-format

  # Type checking
-   repo: local
    hooks:
    -   id: ty
        name: ty check
        entry: bash -c 'ty check ontocast test'
        language: system
        pass_filenames: false
        always_run: true

  # YAML formatting
-   repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.16.0
    hooks:
    -   id: pretty-format-yaml
        args: [--autofix, --indent, '4', --preserve-quotes]

  # JSON formatting
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: pretty-format-json
        args: [--autofix, --indent, '4', --no-sort-keys]

  # TOML formatting and sorting.
  # uv.lock is excluded: it is generated by `uv lock` in uv's own format, so
  # reformatting it here made every dependency change fail CI and then be
  # rewritten by the next uv run.
-   repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.16.0
    hooks:
    -   id: pretty-format-toml
        args: [--autofix]
        exclude: ^uv\.lock$
-   repo: https://github.com/pappasam/toml-sort
    rev: v0.24.3
    hooks:
    -   id: toml-sort
        args: [-ia]
        exclude: ^uv\.lock$
