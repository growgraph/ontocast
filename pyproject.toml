[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
  {email = "alexander@growgraph.dev", name = "Alexander Belikov"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Linguistic"
]
# Every range carries an upper bound. The previous unbounded `>=` floors were
# fiction: `langgraph>=0.2.35` predates the `langgraph.graph.state`
# `CompiledStateGraph` import used by `api/app.py`, so a backtracking resolver
# could select a floor that cannot import the package. Floors now name the
# major actually developed and tested against; ceilings stop the next major
# from breaking every install silently.
dependencies = [
  "click>=8.1.8,<9",
  "docling-core[chunking]>=2.57.0,<3",
  "fastapi>=0.115.0,<1",
  "fastembed>=0.8.0,<1",
  "httpx>=0.27.0,<1",
  "langchain-anthropic>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-google-genai>=4.0,<5",
  "langchain-ollama>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain>=1.0,<2",
  "langgraph>=1.0,<2",
  "networkx>=3.0,<4",
  "numpy>=1.26,<3",
  "oxrdflib>=0.5.0,<0.6",
  "pydantic-settings>=2.5.0,<3",
  "pydantic>=2.11.9,<3",
  "pyld>=3.0,<4",
  "pyoxigraph>=0.5.8,<0.6",
  "python-dotenv>=1.0.0,<2",
  "python-multipart>=0.0.22,<1",
  "pyyaml>=6.0.2,<7",
  "qdrant-client>=1.15.1,<2",
  "rdflib>=7.1.4,<8",
  "requests>=2.32.3,<3",
  "rich>=14.0.0,<16",
  "scikit-learn>=1.4,<2",
  "starlette>=1.0,<2",
  "suthing>=0.4.1,<1",
  "uvicorn[standard]>=0.32.0,<1"
]
description = "Agentic ontology and knowledge graph co-generation"
keywords = [
  "agent",
  "knowledge-graph",
  "llm",
  "ontology",
  "rdf",
  "semantic-web",
  "sparql",
  "triple-extraction"
]
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "ontocast"
readme = "README.md"
requires-python = ">=3.12,<4.0"
version = "0.5.0"

[project.optional-dependencies]
# `plot` is deliberately excluded: pygraphviz builds from source against system
# graphviz headers, so including it here made `pip install ontocast[all]` fail
# on a stock machine. Install it explicitly when you need `plot-graph`.
all = [
  "ontocast[doc-processing,lancedb,semantic-chunking,shacl,web-search]"
]
dev = [
  "anyio>=4.4.0",
  "pre-commit>=4.2.0",
  "pytest-dotenv>=0.5.2",
  "pytest-order>=1.3.0",
  "pytest>=8.3.5",
  "ruff>=0.11.2",
  "ty>=0.0.14"
]
doc-processing = [
  "docling>=2.57.0",
  "easyocr>=1.7.2",
  "sentence-transformers>=5.1.1"
]
docs = [
  "griffe<2.0.0",
  "mkdocs-gen-files>=0.5.0",
  "mkdocs-glightbox>=0.4.0",
  "mkdocs-jupyter>=0.25.1",
  "mkdocs-literate-nav>=0.6.2",
  "mkdocs-material>=9.6.14",
  "mkdocs>=1.6.1",
  "mkdocstrings-python>=2.0.3",
  "mkdocstrings[python]>=0.29.1"
]
lancedb = [
  "lancedb>=0.33.0"
]
plot = [
  "pygraphviz>=1.14"
]
semantic-chunking = [
  "hdbscan>=0.8.41",
  "langchain-huggingface>=0.2.0",
  "torch>=2.0",
  "umap-learn>=0.5.12"
]
shacl = [
  "pyshacl>=0.30.0"
]
web-search = [
  "duckduckgo-search>=8.1.1"
]

[project.scripts]
cmp-states = "ontocast.cli.cmp_states:main"
match-graphs = "ontocast.cli.match_graphs:main"
ontocast = "ontocast.cli.server:cli"
pdfs-to-markdown = "ontocast.cli.pdfs_to_markdown:main"
plot-graph = "ontocast.cli.plot_graph:main"
test-api = "ontocast.cli.test_api:main"

[project.urls]
Changelog = "https://github.com/growgraph/ontocast/blob/main/CHANGELOG.md"
Documentation = "https://growgraph.github.io/ontocast"
Homepage = "https://github.com/growgraph/ontocast"
Issues = "https://github.com/growgraph/ontocast/issues"
Repository = "https://github.com/growgraph/ontocast"

# Without an explicit sdist target hatchling falls back to "everything not
# VCS-ignored", which shipped `data/` (15 MB, and an importable top-level
# `data` package), `docs/` and `demo/` in the source distribution -- exactly
# what the 0.5.0 wheel change removed. `uv publish` uploads both artifacts, so
# the wheel fix alone was not enough.
[tool.hatch.build.targets.sdist]
exclude = [
  "**/.pytest_cache",
  "**/.test_cache",
  "**/__pycache__"
]
include = [
  "/.env.example",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/LICENSE",
  "/README.md",
  "/ontocast",
  "/pyproject.toml",
  "/test"
]

[tool.hatch.build.targets.wheel]
packages = ["ontocast"]

[tool.pyright]
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
addopts = [
  "--disable-warnings",
  "--strict-markers",
  "--tb=short",
  "-v"
]
env_files = [".env"]
markers = [
  "integration: marks tests as integration tests",
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "unit: marks tests as unit tests"
]
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["test"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
line-ending = "auto"

[tool.ruff.lint]
# Kept in sync with the ruff-check pre-commit hook. Previously these ignores
# lived only in .pre-commit-config.yaml args, so the documented
# `uv run ruff check .` reported 282 findings that CI silently ignored.
ignore = ["E501", "E722", "W293"]
select = ["E", "F", "I001", "W"]

[tool.ruff.lint.per-file-ignores]
"ontocast/prompt/*.py" = ["E501"]

[tool.ty.analysis]
# Optional extras loaded lazily / only when selected; pre-commit CI syncs
# `--extra dev` only, so ty must not require them. docling-core is a hard
# dependency and is deliberately NOT listed here -- whitelisting it previously
# hid the fact that `ontocast.onto.state` imported it unguarded while it was
# only in an extra, which made a base `pip install ontocast` unimportable.
allowed-unresolved-imports = [
  "docling.**",
  "duckduckgo_search.**",
  "hdbscan.**",
  "lancedb.**",
  "langchain_huggingface.**",
  "pyshacl.**",
  "umap.**"
]
