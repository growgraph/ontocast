[build-system]
build-backend = "hatchling.build"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython"
]
requires = ["hatchling"]

[project]
dependencies = [
  "click>=8.1.8",
  "docling-core[chunking]>=2.57.0",
  "fastapi>=0.115.0",
  "fastembed>=0.8.0",
  "httpx>=0.27.0",
  "langchain-anthropic>=0.3.0",
  "langchain-core>=0.3.60",
  "langchain-google-genai>=2.0.0",
  "langchain-ollama>=0.3.3",
  "langchain-openai>=0.3.17",
  "langchain>=0.3.25",
  "langgraph>=0.2.35",
  "networkx>=3.0",
  "numpy>=1.26",
  "oxrdflib>=0.5.0",
  "pydantic-settings>=2.5.0",
  "pydantic>=2.11.9",
  "pyld>=2.0.4",
  "pyoxigraph>=0.5.8",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.22",
  "pyyaml>=6.0.2",
  "qdrant-client>=1.15.1",
  "rdflib>=7.1.4",
  "requests>=2.32.3",
  "rich>=14.0.0",
  "scikit-learn>=1.4",
  "starlette>=0.40.0",
  "suthing>=0.4.1",
  "uvicorn[standard]>=0.32.0"
]
description = "Agentic ontology and knowledge graph co-generation"
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "ontocast"
readme = "README.md"
requires-python = ">=3.12,<4.0"
version = "0.5.0"

[project.optional-dependencies]
all = [
  "ontocast[doc-processing,lancedb,plot,semantic-chunking,shacl,web-search]"
]
dev = [
  "anyio>=4.4.0",
  "pre-commit>=4.2.0",
  "pytest-dotenv>=0.5.2",
  "pytest-order>=1.3.0",
  "pytest>=8.3.5",
  "ruff>=0.11.2",
  "ty>=0.0.14"
]
doc-processing = [
  "docling>=2.57.0",
  "easyocr>=1.7.2",
  "sentence-transformers>=5.1.1"
]
docs = [
  "griffe<2.0.0",
  "mkdocs-gen-files>=0.5.0",
  "mkdocs-glightbox>=0.4.0",
  "mkdocs-jupyter>=0.25.1",
  "mkdocs-literate-nav>=0.6.2",
  "mkdocs-material>=9.6.14",
  "mkdocs>=1.6.1",
  "mkdocstrings-python>=2.0.3",
  "mkdocstrings[python]>=0.29.1"
]
lancedb = [
  "lancedb>=0.33.0"
]
plot = [
  "pygraphviz>=1.14"
]
semantic-chunking = [
  "hdbscan>=0.8.41",
  "langchain-huggingface>=0.2.0",
  "torch>=2.0",
  "umap-learn>=0.5.12"
]
shacl = [
  "pyshacl>=0.30.0"
]
web-search = [
  "duckduckgo-search>=8.1.1"
]

[project.scripts]
cmp-states = "ontocast.cli.cmp_states:main"
match-graphs = "ontocast.cli.match_graphs:main"
ontocast = "ontocast.cli.server:cli"
pdfs-to-markdown = "ontocast.cli.pdfs_to_markdown:main"
plot-graph = "ontocast.cli.plot_graph:main"
test-api = "ontocast.cli.test_api:main"

[tool.hatch.build.targets.wheel]
packages = ["ontocast"]

[tool.pyright]
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
addopts = [
  "--disable-warnings",
  "--strict-markers",
  "--tb=short",
  "-v"
]
env_files = [".env"]
markers = [
  "integration: marks tests as integration tests",
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "unit: marks tests as unit tests"
]
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["test"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
line-ending = "auto"

[tool.ruff.lint]
# Kept in sync with the ruff-check pre-commit hook. Previously these ignores
# lived only in .pre-commit-config.yaml args, so the documented
# `uv run ruff check .` reported 282 findings that CI silently ignored.
ignore = ["E501", "E722", "W293"]
select = ["E", "F", "I001", "W"]

[tool.ruff.lint.per-file-ignores]
"ontocast/prompt/*.py" = ["E501"]

[tool.ty.analysis]
# docling (the heavy converter) and lancedb are optional extras loaded lazily via
# importlib; CI type-checks without them. docling-core is a hard dependency and is
# deliberately NOT listed here -- whitelisting it previously hid the fact that
# `ontocast.onto.state` imported it unguarded while it was only in an extra, which
# made a base `pip install ontocast` unimportable.
allowed-unresolved-imports = ["docling.**", "lancedb.**", "pyshacl.**"]
