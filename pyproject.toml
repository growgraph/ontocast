[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
  {email = "alexander@growgraph.dev", name = "Alexander Belikov"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  # No license classifier: `license = "Apache-2.0"` below is the PEP 639 SPDX
  # expression, and PyPI deprecates the classifier form once one is set.
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Linguistic"
]
# Every range carries an upper bound. The previous unbounded `>=` floors were
# fiction: `langgraph>=0.2.35` predates the `langgraph.graph.state`
# `CompiledStateGraph` import used by `api/app.py`, so a backtracking resolver
# could select a floor that cannot import the package. Floors now name the
# major actually developed and tested against; ceilings stop the next major
# from breaking every install silently.
#
# Tiering: the base install is the light embeddable core -- the extraction
# pipeline, the in-memory triple and vector stores, and the ontology tooling.
# Anything that pulls a service SDK, a document-processing stack, or an ML
# runtime lives behind an extra, because `from ontocast import ontocast_tools`
# must not install a gRPC stack and an ONNX runtime. `test/test_import_weight.py`
# is the regression guard; see docs/user_guide/embedding.md for the tiers.
dependencies = [
  "httpx>=0.27.0,<1",
  "langchain-core>=1.0,<2",
  "langgraph>=1.0,<2",
  "numpy>=1.26,<3",
  "oxrdflib>=0.5.0,<0.6",
  "pydantic-settings>=2.5.0,<3",
  "pydantic>=2.11.9,<3",
  "pyld>=3.0,<4",
  "pyoxigraph>=0.5.8,<0.6",
  "pyyaml>=6.0.2,<7",
  "rdflib>=7.1.4,<8",
  "scikit-learn>=1.4,<2"
]
description = "Agentic ontology and knowledge graph co-generation"
keywords = [
  "agent",
  "knowledge-graph",
  "llm",
  "ontology",
  "rdf",
  "semantic-web",
  "sparql",
  "triple-extraction"
]
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "ontocast"
readme = "README.md"
requires-python = ">=3.12,<4.0"
version = "0.6.1"

[project.optional-dependencies]
# `plot` is deliberately excluded: pygraphviz builds from source against system
# graphviz headers, so including it here made `pip install ontocast[all]` fail
# on a stock machine. Install it explicitly when you need `plot-graph`.
all = [
  "ontocast[anthropic,doc-processing,documents,google,graph,lancedb,ollama,openai,qdrant,semantic-chunking,server,shacl,sparse,web-search]"
]
anthropic = [
  "langchain-anthropic>=1.0,<2"
]
dev = [
  "anyio>=4.4.0",
  "pre-commit>=4.2.0",
  "pytest-order>=1.3.0",
  "pytest>=8.3.5",
  "ruff>=0.11.2",
  "ty>=0.0.14"
]
# `documents` is the docling-core layer needed to *represent* and chunk a
# converted document; `doc-processing` adds the converters that produce one
# from a PDF. Chunking additionally downloads a HuggingFace tokenizer at
# runtime, so a base install cannot chunk -- use run_unit_pipeline instead.
doc-processing = [
  "docling>=2.57.0",
  "easyocr>=1.7.2",
  "ontocast[documents]",
  "sentence-transformers>=5.1.1"
]
docs = [
  "griffe<2.0.0",
  "mkdocs-gen-files>=0.5.0",
  "mkdocs-glightbox>=0.4.0",
  "mkdocs-jupyter>=0.25.1",
  "mkdocs-literate-nav>=0.6.2",
  "mkdocs-material>=9.6.14",
  "mkdocs>=1.6.1",
  "mkdocstrings-python>=2.0.3",
  "mkdocstrings[python]>=0.29.1"
]
documents = [
  "docling-core[chunking]>=2.57.0,<3"
]
google = [
  "langchain-google-genai>=4.0,<5"
]
graph = [
  "networkx>=3.0,<4"
]
lancedb = [
  "lancedb>=0.33.0",
  "ontocast[sparse]"
]
ollama = [
  "langchain-ollama>=1.0,<2"
]
openai = [
  "langchain-openai>=1.0,<2"
]
plot = [
  "pygraphviz>=1.14"
]
qdrant = [
  "ontocast[sparse]",
  "qdrant-client>=1.15.1,<2"
]
semantic-chunking = [
  "hdbscan>=0.8.41",
  "sentence-transformers>=5.1.1",
  "torch>=2.0",
  "umap-learn>=0.5.12"
]
# FastAPI app, uvicorn, and everything the `ontocast` console script needs.
server = [
  "click>=8.1.8,<9",
  "fastapi>=0.115.0,<1",
  "ontocast[documents]",
  "python-dotenv>=1.0.0,<2",
  "python-multipart>=0.0.22,<1",
  "rich>=14.0.0,<16",
  "starlette>=1.0,<2",
  "suthing>=0.4.1,<1",
  "uvicorn[standard]>=0.32.0,<1"
]
shacl = [
  "pyshacl>=0.30.0"
]
# BM25 sparse embeddings. Pulled in by both vector backends; on its own it is
# only useful if you wire FastembedBm25SparseTool yourself.
sparse = [
  "fastembed>=0.8.0,<1"
]
web-search = [
  "duckduckgo-search>=8.1.1"
]

# All scripts route through ontocast.cli._entry, which turns a missing
# `ontocast[server]` install into a directive message instead of a bare
# ModuleNotFoundError for click.
[project.scripts]
match-graphs = "ontocast.cli._entry:match_graphs"
ontocast = "ontocast.cli._entry:ontocast"
pdfs-to-markdown = "ontocast.cli._entry:pdfs_to_markdown"
plot-graph = "ontocast.cli._entry:plot_graph"

[project.urls]
Changelog = "https://github.com/growgraph/ontocast/blob/main/CHANGELOG.md"
Documentation = "https://growgraph.github.io/ontocast"
Homepage = "https://github.com/growgraph/ontocast"
Issues = "https://github.com/growgraph/ontocast/issues"
Repository = "https://github.com/growgraph/ontocast"

# Without an explicit sdist target hatchling falls back to "everything not
# VCS-ignored", which shipped `data/` (15 MB, and an importable top-level
# `data` package), `docs/` and `demo/` in the source distribution -- exactly
# what the 0.5.0 wheel change removed. `uv publish` uploads both artifacts, so
# the wheel fix alone was not enough.
[tool.hatch.build.targets.sdist]
exclude = [
  "**/.pytest_cache",
  "**/.test_cache",
  "**/__pycache__"
]
include = [
  "/.env.example",
  "/.env.example.minimal",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/LICENSE",
  "/README.md",
  "/ontocast",
  "/pyproject.toml",
  "/test"
]

[tool.hatch.build.targets.wheel]
packages = ["ontocast"]

[tool.pyright]
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
# `-pno:dotenv` is one token on purpose. toml-sort runs with `--all`, which sorts
# array *values*, so a two-token `-p no:dotenv` gets pulled apart -- it was sorted
# into `-p`, `-v`, `no:dotenv` once already, and `-p` then swallowed `-v`. Keep
# every element self-contained and re-sorting stays harmless. Same reason the
# explanation lives above the key rather than inside the array: an in-array
# comment ends up attached to whichever element sorts next to it.
#
# What it guards: the suite must never inherit a developer's live .env.
# pytest-dotenv loads a discovered dotenv file even with no `env_files` set,
# which silently fed local configuration into every `BaseSettings` built in a
# test (a real RENDER_MODE=facts left the ontology block untested) and put a real
# LLM_API_KEY in the environment. Blocked here as well as uninstalled, so a
# globally-installed copy cannot resurrect it. `test/conftest.py` asserts the
# result, so a future mangling fails loudly instead of silently. Tests that need
# a variable set it with `monkeypatch`.
addopts = [
  "--disable-warnings",
  "--strict-markers",
  "--tb=short",
  "-pno:dotenv",
  "-v"
]
# Marker semantics -- keep these honest, the CI job selects on them.
#
# The default run must stay offline and model-free: `HF_HUB_OFFLINE=1
# TRANSFORMERS_OFFLINE=1 uv run pytest -m "not slow"` has to pass. A test that
# cannot meet that bar belongs behind `slow` (it downloads or loads a model, or
# takes more than a few seconds) or `integration` (it needs a live service:
# Qdrant, Fuseki, or an on-disk LanceDB table). Service-gated tests still skip
# themselves when the service is unreachable -- the marker is what makes that
# surface *selectable* rather than merely silent.
#
# `test/manual/` is opt-in through ONTOCAST_RUN_MANUAL_TESTS=1 and is not
# collected otherwise (see test/manual/conftest.py); it needs no marker.
markers = [
  "integration: needs a live service (Qdrant/Fuseki/LanceDB on disk)",
  "slow: loads an ML model or otherwise takes >5s (deselect with '-m \"not slow\"')",
  "unit: marks tests as unit tests"
]
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["test"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
line-ending = "auto"

[tool.ruff.lint]
# Kept in sync with the ruff-check pre-commit hook. Previously these ignores
# lived only in .pre-commit-config.yaml args, so the documented
# `uv run ruff check .` reported 282 findings that CI silently ignored.
ignore = ["E501", "E722", "W293"]
select = ["E", "F", "I001", "W"]

[tool.ruff.lint.per-file-ignores]
"ontocast/prompt/*.py" = ["E501"]

[tool.ty.analysis]
# The heavy tail of the optional tier: loaded lazily / only when selected, and
# too expensive to install just to type-check. The pre-commit workflow syncs
# only `dev,server,documents,qdrant,graph`, so anything outside that set must be
# listed here -- the two lists together have to cover every third-party import
# under `ontocast/` and `test/`. docling-core is deliberately NOT listed here:
# whitelisting it previously hid the fact that `ontocast.onto.state` imported it
# unguarded while it was only in an extra, which made a base
# `pip install ontocast` unimportable.
allowed-unresolved-imports = [
  "docling.**",
  "duckduckgo_search.**",
  "hdbscan.**",
  "lancedb.**",
  "pyshacl.**",
  "umap.**"
]
