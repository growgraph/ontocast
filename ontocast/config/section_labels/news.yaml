schema_version: "1.3"
id: news
description: News article and press release section headings
document_profile: >-
    A news article or press release announcing a recent event, carrying a
    dateline, quotations attributed to named people, and closing organisational
    boilerplate about the issuing company.
labels:
-   id: headline
    description: 'The article''s title and standfirst.'
    heading_patterns:
    -   '^headline\s*$'
    -   '^(?:for\s+)?immediate\s+release\s*$'
    -   '^press\s+release\s*$'
    -   '^news\s+release\s*$'
    keywords:
    -   for immediate release
    -   press release
    -   news release
    -   media release
-   id: summary
    description: 'The lead: the news in brief, who, what, when, where.'
    heading_patterns:
    -   '^summary\s*$'
    -   '^key\s+points\s*$'
    -   '^highlights?\s*$'
    -   '^at\s+a\s+glance\s*$'
    keywords:
    -   key points
    -   at a glance
    -   key takeaways
    -   highlights
-   id: body
    description: 'The main report of events and facts.'
    heading_patterns:
    -   '^body\s*$'
    -   '^story\s*$'
    -   '^details?\s*$'
    keywords:
    -   full story
    -   story
-   id: quotes
    description: 'Statements quoted from people involved.'
    heading_patterns:
    -   '^quotes?\s*$'
    -   '^statements?\s*$'
    -   '^reactions?\s*$'
    keywords:
    -   quotes
    -   statement from
    -   reaction
-   id: background
    description: 'Context and history behind the news.'
    heading_patterns:
    -   '^background\s*$'
    -   '^context\s*$'
    keywords:
    -   background
    -   related news
-   id: boilerplate
    description: 'Standard description of the issuing organisation, repeated across releases.'
    route_class: boilerplate
    heading_patterns:
    -   '^about\s+.{0,60}$'
    -   '^boilerplate\s*$'
    -   '^forward[\s-]looking\s+statements?\s*$'
    keywords:
    -   forward-looking statements
    -   about the company
-   id: contact
    description: 'Press contact names, phone numbers and addresses.'
    route_class: boilerplate
    heading_patterns:
    -   '^(?:media\s+|press\s+|investor\s+)?contacts?\s*$'
    -   '^(?:media|press)\s+enquiries\s*$'
    -   '^for\s+more\s+information\s*$'
    keywords:
    -   media contact
    -   press contact
    -   investor relations
    -   media enquiries
    -   sources
    -   for more information
