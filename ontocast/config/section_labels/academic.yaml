schema_version: "1.3"
id: academic
description: IMRaD and common paper or report section headings
document_profile: >-
    A scholarly article, conference paper, thesis or literature review reporting
    original research carried out by its authors -- experiments, measurements or
    analysis -- and written for a research audience.
labels:
-   id: abstract
    description: 'A one-paragraph summary of the whole work, before the body: question, approach, main results.'
    heading_patterns:
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?abstract[.:;—\-]*\s*$'
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?abstract\s*[:.—\-]\s*$'
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?ABSTRACT\s*$'
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?(?:executive\s+summary|synopsis)\s*$'
    keywords:
    -   abstract
    -   executive summary
    -   synopsis
-   id: introduction
    description: 'Opening framing: the problem, why it matters and what the work contributes.'
    heading_patterns:
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?introduction\s*$'
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?(?:overview|preamble|foreword|preface|motivation)\s*$'
    keywords:
    -   introduction
    -   motivation
    -   preamble
    -   foreword
    -   preface
-   id: related_work
    description: 'A survey of earlier work by others, compared with this one.'
    heading_patterns:
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?related\s+work\s*$'
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?(?:related\s+(?:literature|approaches?|research|studies)|prior\s+(?:work|art)|literature\s+(?:review|survey)|state\s+of\s+the\s+art|survey)\s*$'
    keywords:
    -   related work
    -   related literature
    -   prior work
    -   prior art
    -   literature review
    -   state of the art
-   id: background
    description: 'Concepts, theory or context a reader needs before the method.'
    heading_patterns:
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?background\s*$'
    keywords:
    -   background
    -   preliminaries
    -   theory
-   id: methods
    description: 'How the work was done: materials, procedures, setups, models, parameters.'
    heading_patterns:
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?methods?\s*$'
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?methodology\s*$'
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?(?:materials?\s+and\s+)?(?:methods?|methodology|approach|experimental\s+setup|proposed\s+(?:method|model|framework|system)|implementation|design|procedure|protocol|framework|architecture)\s*$'
    keywords:
    -   methods
    -   method
    -   methodology
    -   experimental
    -   experiment section
    -   materials
    -   procedure
    -   protocol
    -   implementation
    -   fabrication
    -   synthesis
    -   preparation
    -   characterization
    -   characterisation
    -   apparatus
    -   instrumentation
    -   simulation details
    -   computational details
-   id: results
    description: 'What was observed or measured, reported with figures, tables and values.'
    heading_patterns:
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?results?\s*$'
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?(?:experimental\s+)?(?:results?|findings?|evaluation|experiments?|ablation(?:\s+stud(?:y|ies))?|outcomes?|performance|benchmarks?)\s*$'
    keywords:
    -   results
    -   result
    -   findings
    -   evaluation
    -   ablation
    -   outcomes
    -   benchmarks
    -   measurements
-   id: discussion
    description: 'Interpretation of the results: meaning, comparison, mechanisms, implications.'
    heading_patterns:
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?discussion\s*$'
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?(?:analysis|interpretation|observations?)\s*$'
    keywords:
    -   discussion
    -   interpretation
    -   implications
-   id: conclusion
    description: 'The closing summary of findings and their significance.'
    heading_patterns:
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?conclusions?\s*$'
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?(?:conclusions?|concluding\s+remarks?|summary|final\s+remarks?|final\s+thoughts|takeaways?|wrap[\s-]?up)\s*$'
    keywords:
    -   conclusion
    -   conclusions
    -   concluding remarks
    -   summary
    -   takeaways
-   id: future_work
    description: 'Directions the authors propose for later work.'
    heading_patterns:
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?future\s+work\s*$'
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?(?:future\s+(?:work|directions?|research)|next\s+steps?|roadmap|outlook)\s*$'
    keywords:
    -   future work
    -   future directions
    -   future research
    -   next steps
    -   outlook
    -   perspectives
-   id: limitations
    description: 'Acknowledged weaknesses, threats to validity or scope limits of the work.'
    heading_patterns:
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?limitations?\s*$'
    keywords:
    -   limitations
    -   threats to validity
-   id: acknowledgements
    description: 'Thanks to people, funders and facilities; funding and grant statements.'
    route_class: boilerplate
    heading_patterns:
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?acknowledg(?:e?ments?|ments?)\s*$'
    keywords:
    -   acknowledgment
    -   acknowledgments
    -   acknowledgement
    -   acknowledgements
    -   author contributions
    -   author information
    -   competing interests
    -   conflicts of interest
    -   conflict of interest
    -   funding
    -   disclosure
    -   corresponding authors
    -   declaration of competing interest
    -   declarations of interest
-   id: back_matter
    description: 'Administrative statements: author contributions, competing interests, data availability, ethics, affiliations.'
    route_class: non_content
    heading_patterns:
    -   '^authors?\s*$'
    -   '^authors?[’'']?s?\s+(?:details|addresses)\s*$'
    -   '^affiliations?\s*$'
    -   '^notes?\s*$'
    -   '^orcid(?:\s*i\.?d\.?s?)?\s*$'
    -   '^(?:data|code|materials?)(?:\s+and\s+(?:code|materials?|software))?\s+availability(?:\s+statement)?\s*$'
    -   '^availability\s+of\s+(?:data|code|materials?)(?:\s+and\s+(?:code|materials?))?\s*$'
    -   '^licen[cs]e(?:\s+information)?\s*$'
    -   '^open\s+access\s*$'
    -   '^rights\s+and\s+permissions\s*$'
    -   '^additional\s+information\s*$'
    -   '^publisher[’'']?s?\s+note\s*$'
    -   '^copyright\s*$'
    -   '^disclaimer\s*$'
    -   '^associated\s+content\s*$'
    -   '^ethics\s+(?:declarations?|statement|approval)\s*$'
    keywords:
    -   orcid
    -   author details
    -   affiliations
    -   data availability
    -   code availability
    -   data and code availability
    -   open access
    -   rights and permissions
    -   additional information
    -   publisher's note
    -   disclaimer
    -   associated content
    -   ethics declarations
    -   ethics statement
-   id: data
    description: 'A description of the datasets used or released: sources, composition, collection.'
    heading_patterns:
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?data(?:set|sets)?\s*$'
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?(?:corpus|data\s+(?:collection|description))\s*$'
    keywords:
    -   data collection
    -   data description
    -   dataset
    -   datasets
    -   corpus
-   id: appendix
    description: 'Supplementary material after the main text: derivations, extra figures, tables, supporting information.'
    heading_patterns:
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?appendi(?:x|ces)\s*$'
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?(?:supplementary\s+material|supplement)\s*$'
    keywords:
    -   appendix
    -   appendices
    -   supplementary material
    -   supplementary information
    -   supporting information
    -   supplementary note
    -   supplementary notes
-   id: references
    description: 'The list of cited works, one bibliographic entry per item.'
    route_class: citations
    terminal: true
    heading_patterns:
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?references\s*$'
    -   '^(?:(?:\d+|[IVXivx]+)(?:\.\d+)*[.)]\s*)?(?:bibliography|works\s+cited)\s*$'
    keywords:
    -   references
    -   bibliography
    -   works cited
    -   literature cited
