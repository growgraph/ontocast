schema_version: "1.3"
id: patent
description: Patent application and granted-patent section headings
document_profile: >-
    A patent application or granted patent disclosing an invention, setting out
    its technical field, the prior art it improves on, described embodiments,
    and numbered legal claims defining the scope of protection sought.
labels:
-   id: abstract
    description: 'A short summary of the invention.'
    heading_patterns:
    -   '^abstract\s*$'
    -   '^abstract\s+of\s+the\s+disclosure\s*$'
    keywords:
    -   abstract
-   id: field
    description: 'The technical field the invention belongs to.'
    heading_patterns:
    -   '^(?:technical\s+)?field\s*$'
    -   '^field\s+of\s+the\s+invention\s*$'
    -   '^field\s+of\s+(?:the\s+)?disclosure\s*$'
    keywords:
    -   technical field
    -   field of the invention
    -   field of the disclosure
-   id: background
    description: 'The state of the art and the problem the invention addresses.'
    heading_patterns:
    -   '^background\s*$'
    -   '^background\s+(?:of\s+the\s+)?(?:invention|art|disclosure)\s*$'
    keywords:
    -   background of the invention
    -   background art
-   id: prior_art
    description: 'Earlier patents and publications and their shortcomings.'
    heading_patterns:
    -   '^prior\s+art\s*$'
    -   '^related\s+art\s*$'
    -   '^description\s+of\s+(?:the\s+)?(?:related|prior)\s+art\s*$'
    keywords:
    -   prior art
    -   related art
-   id: summary
    description: 'A summary of the invention and its advantages.'
    heading_patterns:
    -   '^summary\s*$'
    -   '^summary\s+of\s+the\s+(?:invention|disclosure)\s*$'
    keywords:
    -   summary of the invention
    -   summary of the disclosure
    -   disclosure of the invention
-   id: brief_description_of_drawings
    description: 'One line per figure saying what it shows.'
    heading_patterns:
    -   '^brief\s+description\s+of\s+(?:the\s+)?(?:drawings?|figures?)\s*$'
    -   '^description\s+of\s+(?:the\s+)?(?:drawings?|figures?)\s*$'
    keywords:
    -   brief description of the drawings
    -   description of the drawings
    -   description of the figures
-   id: detailed_description
    description: 'The full description of embodiments of the invention.'
    heading_patterns:
    -   '^detailed\s+description\s*$'
    -   '^detailed\s+description\s+of\s+(?:the\s+)?(?:invention|embodiments?|preferred\s+embodiments?)\s*$'
    -   '^description\s+of\s+(?:the\s+)?(?:preferred\s+)?embodiments?\s*$'
    -   '^modes?\s+for\s+carrying\s+out\s+the\s+invention\s*$'
    keywords:
    -   detailed description
    -   preferred embodiment
    -   preferred embodiments
    -   embodiments of the invention
    -   modes for carrying out
    -   industrial applicability
    -   landscapes
    -   classifications
-   id: examples
    description: 'Worked examples or experiments carrying out the invention, often with measured values.'
    heading_patterns:
    -   '^examples?\s*$'
    -   '^working\s+examples?\s*$'
    -   '^example\s+(?:\d+|[IVXivx]+)\s*$'
    keywords:
    -   working example
    -   working examples
-   id: claims
    description: 'Numbered claims defining the legal scope of protection.'
    heading_patterns:
    -   '^claims?\s*$'
    -   '^what\s+is\s+claimed\s+is\s*$'
    -   '^we\s+claim\s*$'
    -   '^i\s+claim\s*$'
    keywords:
    -   claims
    -   what is claimed
    -   we claim
    -   the invention claimed is
-   id: citations
    description: 'Lists of patent and non-patent documents cited.'
    route_class: boilerplate
    heading_patterns:
    -   '^citation\s+list\s*$'
    -   '^references?\s+cited\s*$'
    -   '^patent\s+(?:literature|documents?)\s*$'
    -   '^non[\s-]?patent\s+literature\s*$'
    keywords:
    -   citation list
    -   references cited
    -   patent literature
    -   non-patent literature
    -   cited by
    -   family cites
    -   also published as
    -   similar documents
    -   legal events
    -   applications claiming priority
    -   priority applications
